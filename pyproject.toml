[project]
name = "banking-agent-hooks-demo"
version = "0.1.0"
description = "A presentation-first banking payments demo for Microsoft Agent Framework Agent Hooks."
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "agent-hooks-sdk==0.1.0b2",
    "azure-identity>=1.20.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["banking_demo"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["banking_demo"]
